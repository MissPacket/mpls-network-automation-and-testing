---
all:
  hosts:
    srx240_1:
      ansible_host: 192.168.1.29
      router_id: 1.1.1.1
      role: ce
      customer: customer_a
      bgp_as: 65001
      interfaces:
        - {if_name: "ge-0/0/2", if_addr: "8.1.1.1/30", type: "pe-ce"}
        - {if_name: "lo0",      if_addr: "1.1.1.1/32",  type: "loopback"}
      bgp_neighbors:
        - peer_ip: 8.1.1.2
          peer_as: 65000
          description: "PE1 eBGP"

    srx240_2:
      ansible_host: 192.168.1.30
      router_id: 1.1.1.2
      role: pe
      bgp_as: 65000
      interfaces:
        - {if_name: "ge-0/0/3", if_addr: "8.1.1.2/30",  area: "0", type: "pe-ce"}
        - {if_name: "ge-0/0/1", if_addr: "7.1.1.1/30",  area: "0", type: "core"}
        - {if_name: "ge-0/0/2", if_addr: "7.1.1.14/30", area: "0", type: "core"}
        - {if_name: "lo0",      if_addr: "1.1.1.2/32",  area: "0", type: "loopback"}
      vrfs:
        - name: CUSTOMER_A
          rd: "65000:100"
          rt_export: "65000:100"
          rt_import: "65000:100"
          interfaces: ["ge-0/0/3"]
          ce_neighbor:
            peer_ip: 8.1.1.1
            peer_as: 65001
      ibgp_neighbors:
        - peer_ip: 1.1.1.4
          description: "PE2 iBGP"

    srx240_3:
      ansible_host: 192.168.1.31
      router_id: 1.1.1.3
      role: p
      interfaces:
        - {if_name: "ge-0/0/1", if_addr: "7.1.1.2/30", area: "0", type: "core"}
        - {if_name: "ge-0/0/2", if_addr: "7.1.1.5/30", area: "0", type: "core"}
        - {if_name: "lo0",      if_addr: "1.1.1.3/32",  area: "0", type: "loopback"}

    srx240_4:
      ansible_host: 192.168.1.32
      router_id: 1.1.1.4
      role: pe
      bgp_as: 65000
      interfaces:
        - {if_name: "ge-0/0/1", if_addr: "7.1.1.6/30",  area: "0", type: "core"}
        - {if_name: "ge-0/0/2", if_addr: "7.1.1.9/30",  area: "0", type: "core"}
        - {if_name: "ge-0/0/3", if_addr: "9.1.1.1/30",  area: "0", type: "pe-ce"}
        - {if_name: "lo0",      if_addr: "1.1.1.4/32",  area: "0", type: "loopback"}
      vrfs:
        - name: CUSTOMER_A
          rd: "65000:100"
          rt_export: "65000:100"
          rt_import: "65000:100"
          interfaces: ["ge-0/0/3"]
          ce_neighbor:
            peer_ip: 9.1.1.2
            peer_as: 65002
      ibgp_neighbors:
        - peer_ip: 1.1.1.2
          description: "PE1 iBGP"

    srx240_5:
      ansible_host: 192.168.1.33
      router_id: 1.1.1.5
      role: p
      interfaces:
        - {if_name: "ge-0/0/1", if_addr: "7.1.1.10/30", area: "0", type: "core"}
        - {if_name: "ge-0/0/2", if_addr: "7.1.1.13/30", area: "0", type: "core"}
        - {if_name: "lo0",      if_addr: "1.1.1.5/32",   area: "0", type: "loopback"}

    srx240_6:
      ansible_host: 192.168.1.34
      router_id: 1.1.1.6
      role: ce
      customer: customer_a
      bgp_as: 65002
      interfaces:
        - {if_name: "ge-0/0/2", if_addr: "9.1.1.2/30", type: "pe-ce"}
        - {if_name: "lo0",      if_addr: "1.1.1.6/32",  type: "loopback"}
      bgp_neighbors:
        - peer_ip: 9.1.1.1
          peer_as: 65000
          description: "PE2 eBGP"

  children:
    pe_routers:
      hosts:
        srx240_2:
        srx240_4:
    p_routers:
      hosts:
        srx240_3:
        srx240_5:
    ce_routers:
      hosts:
        srx240_1:
        srx240_6:
    mpls_core:
      hosts:
        srx240_2:
        srx240_3:
        srx240_4:
        srx240_5:

  vars:
    ansible_python_interpreter: /usr/bin/python3
    core_bgp_as: 65000
